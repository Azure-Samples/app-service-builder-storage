# yaml-language-server: $schema=https://aka.ms/azure.yaml.json
name: filevault
requiredVersions:
  azd: ">=1.29.0 <2.0.0"
infra:
  provider: bicep
  path: infra/azd
workflows:
  up:
    steps:
      - azd: hooks run preprovision
      - azd: provision
      - azd: hooks run predeploy
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/azd.ps1 preprovision
    interactive: true
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./scripts/azd.ps1 postprovision
    interactive: true
    continueOnError: false
  predeploy:
    shell: pwsh
    run: ./scripts/azd.ps1 predeploy
    interactive: true
    continueOnError: false
  predown:
    shell: pwsh
    run: ./scripts/azd.ps1 predown
    interactive: true
    continueOnError: false
  postdown:
    shell: pwsh
    run: ./scripts/azd.ps1 postdown
    interactive: true
    continueOnError: false
